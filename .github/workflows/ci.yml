name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

jobs:
  moonbit:
    name: MoonBit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 0.10.5+5e7afb0c0
          core-version: 0.10.5+5e7afb0c0
      - name: Resolve MoonBit dependencies
        run: |
          moon update
          moon install
      - name: Record toolchain
        run: moon version --all
      - name: Check generated interfaces and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
      - name: Check all targets
        run: moon check --target all
      - name: Run MoonBit tests (core and examples/mmo)
        run: moon test
      - name: Build WASM-GC
        run: moon build --target wasm-gc

  prove:
    name: Why3/Z3 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 0.10.5+5e7afb0c0
          core-version: 0.10.5+5e7afb0c0
      - name: Resolve MoonBit dependencies
        run: |
          moon update
          moon install
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prove contracts
        run: nix develop path:. --command moon prove src/contracts

  cf-room:
    name: Cloudflare host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 0.10.5+5e7afb0c0
          core-version: 0.10.5+5e7afb0c0
      - name: Resolve MoonBit dependencies
        run: |
          moon update
          moon install
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          package_json_file: examples/mmo/cf-room/package.json
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/mmo/cf-room/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir examples/mmo/cf-room install --frozen-lockfile
      - name: Type-check
        run: pnpm --dir examples/mmo/cf-room typecheck
      - name: Test the Durable Object room
        run: pnpm --dir examples/mmo/cf-room test
      - name: Validate deploy bundle
        run: pnpm --dir examples/mmo/cf-room deploy:dry
